syntax = "proto3";

package control.v1;

option go_package = "encore.app/control/proto/controlv1";

service ModelControl {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetModel(GetModelRequest) returns (Model);
  rpc LoadModel(LoadModelRequest) returns (Model);
  rpc UnloadModel(UnloadModelRequest) returns (Model);
  rpc ReloadModel(ReloadModelRequest) returns (Model);
}

service BackendControl {
  rpc ListBackends(ListBackendsRequest) returns (ListBackendsResponse);
  rpc GetBackend(GetBackendRequest) returns (Backend);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message Model {
  string id = 1;
  string frontend = 2;
  string path = 3;
  string purpose = 4;
  string native_id = 5;
  string desired_state = 6;
  string observed_state = 7;
  optional string socket_path = 8; // unset for mlxlm
  string last_error = 9;
  optional int64 pid = 10;         // unset when unloaded
  optional int64 memory_mb = 11;   // theoretical; unset when unloaded
}

message Backend {
  string kind = 1;
  optional string socket_path = 2; // unset for mlxlm
  string observed_state = 3;
  string last_error = 4;
  bool ready = 5;
  repeated int64 pids = 6;         // empty = none
  optional int64 memory_mb = 7;    // latest sample; unset if none
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated Model models = 1;
}

message GetModelRequest {
  string id = 1;
}

message LoadModelRequest {
  string id = 1;
}

message UnloadModelRequest {
  string id = 1;
}

message ReloadModelRequest {
  string id = 1;
}

message ListBackendsRequest {}

message ListBackendsResponse {
  repeated Backend backends = 1;
}

message GetBackendRequest {
  string kind = 1;
}

message HealthRequest {}

message HealthResponse {
  repeated Backend backends = 1;
}
